<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理后台 · 西南大学商贸学院学生就业服务平台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d1d1f' stroke-width='2'%3E%3Crect x='3' y='11' width='18' height='11' rx='2'/%3E%3Cpath d='M7 11V7a5 5 0 0110 0v4'/%3E%3Ccircle cx='12' cy='16' r='1'/%3E%3C/svg%3E">
  <style>
    :root {
      --p: #0071e3;
      --p-l: #42a5f5;
      --p-d: #0b5cad;
      --p-bg: rgba(0,113,227,.09);
      --p-bg-l: #f5f5f7;
      --accent: #0071e3;
      --success: #1e8e4e;
      --success-l: rgba(52,199,89,.12);
      --warn: #c93400;
      --warn-l: rgba(255,149,0,.12);
      --danger: #d70015;
      --danger-l: rgba(255,59,48,.1);
      --primary: var(--p);
      --primary-l: var(--p-l);
      --primary-ll: var(--p-bg);
      --surface: #fff;
      --bg: #f5f5f7;
      --border: rgba(0,0,0,.08);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --muted-l: #86868b;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(0,0,0,.04);
      --shadow-md: 0 2px 8px rgba(0,0,0,.06);
      --sidebar-w: 240px;
      --header-h: 56px;
      --transition-ease: cubic-bezier(.4,0,.2,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; overflow: hidden;
    }
    /* ══ Lock Screen ══ */
    #lockScreen {
      position: fixed; inset: 0; z-index: 9999;
      background: #f5f5f7;
      display: flex; align-items: center; justify-content: center;
    }
    .lock-box {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 48px 40px;
      width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,.03), 0 24px 60px rgba(0,0,0,.09);
      text-align: center;
      animation: fadeUp .4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .lock-icon { margin-bottom: 16px; }
    .lock-icon svg { width: 52px; height: 52px; }
    .lock-title { font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: var(--text); margin-bottom: 6px; }
    .lock-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
    .lock-input {
      width: 100%;
      background: #fff;
      border: 1px solid rgba(0,0,0,.14);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 16px; color: var(--text);
      outline: none;
      letter-spacing: 3px;
      transition: border-color .2s;
      margin-bottom: 12px;
    }
    .lock-input::placeholder { color: var(--muted-l); letter-spacing: 1px; }
    .lock-input:focus { border-color: var(--p); box-shadow: 0 0 0 4px rgba(0,113,227,.15); }
    .lock-input.err { border-color: #f87171; animation: shake .3s; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }
    .lock-btn {
      width: 100%;
      background: var(--p);
      color: #fff;
      border: none;
      border-radius: 980px;
      padding: 13px;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .lock-btn:hover { opacity: .92; }
    .lock-btn:active { transform: scale(.98); }
    .lock-btn:disabled { opacity: .5; cursor: not-allowed; }
    .lock-err { font-size: 13px; color: var(--danger); margin-top: 10px; min-height: 20px; }
    .lock-back { margin-top: 16px; font-size: 13px; color: var(--muted); }
    .lock-back a { color: var(--p); text-decoration: none; }
    .lock-back a:hover { text-decoration: underline; }
    .lock-row { display: flex; gap: 12px; margin-bottom: 12px; }
    .lock-row .lock-input { margin-bottom: 0; }

    /* ══ Layout ══ */
    #app { display: flex; height: 100vh; overflow: hidden; }
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: #fbfbfd; color: var(--text-l); border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: margin-left .3s, opacity .3s;
      z-index: 200;
      border-right: 1px solid var(--border);
    }
    .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); }
    .sidebar-brand {
      padding: 16px 20px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-brand .logo { width: 28px; height: 28px; color: var(--p); }
    .sidebar-brand .name { font-size: 15px; font-weight: 700; color: var(--text); }
    .sidebar-brand .badge {
      background: var(--p); color: #fff; font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 980px; letter-spacing: .5px;
    }
    .sidebar-nav {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 8px 0;
    }
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .sidebar-nav .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px;
      font-size: 13.5px; font-weight: 500;
      cursor: pointer; color: var(--text-l);
      transition: all .15s var(--transition-ease);
      user-select: none;
      border-left: 3px solid transparent;
    }
    .sidebar-nav .nav-item:hover { background: rgba(156,107,60,.06); color: var(--text); }
    .sidebar-nav .nav-item.active { background: var(--p-bg); color: var(--p); border-left-color: var(--p); }
    .sidebar-nav .nav-item .icon { width: 22px; height: 22px; text-align: center; flex-shrink: 0; }
    .sidebar-nav .nav-item .icon svg { width: 18px; height: 18px; }
    .sidebar-nav .nav-item .arrow { margin-left: auto; font-size: 11px; transition: transform .2s; }
    .sidebar-nav .nav-item .arrow.open { transform: rotate(90deg); }
    .sidebar-nav .sub-menu {
      overflow: hidden; max-height: 0;
      transition: max-height .25s ease;
    }
    .sidebar-nav .sub-menu.open { max-height: 200px; }
    .sidebar-nav .sub-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 20px 8px 50px;
      font-size: 13px; color: var(--text-l);
      cursor: pointer; transition: all .15s;
    }
    .sidebar-nav .sub-item:hover { color: var(--text); background: rgba(156,107,60,.04); }
    .sidebar-nav .sub-item.active { color: var(--p); background: rgba(156,107,60,.08); }

    .main-area {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; min-width: 0;
    }
    .topbar {
      height: var(--header-h); min-height: var(--header-h);
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .hamburger {
      background: none; border: none; font-size: 20px;
      color: var(--muted); cursor: pointer; padding: 4px;
      line-height: 1; display: none;
    }
    .hamburger:hover { color: var(--text); }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar-user { font-size: 13px; color: var(--muted); }
    .btn-logout {
      background: none; border: 1.5px solid var(--border);
      color: var(--muted); font-size: 12px; font-weight: 600;
      padding: 6px 14px; border-radius: 7px; cursor: pointer;
      transition: all .15s;
    }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    .content {
      flex: 1; overflow-y: auto; padding: 24px;
      position: relative; z-index: 1;
    }
    .content::-webkit-scrollbar { width: 6px; }
    .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

    /* ══ Cards ══ */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface); border-radius: var(--radius);
      padding: 20px; border: 1px solid var(--border);
      transition: border-color .2s var(--transition-ease);
    }
    .stat-card:hover { border-color: var(--p-l); }
    .stat-card .label { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: var(--text); }
    .stat-card .value.revenue { color: var(--success); }
    .stat-card .value.cost { color: var(--danger); }
    .stat-card .value.profit { color: var(--p); }

    .card {
      background: var(--surface); border-radius: var(--radius);
      padding: 24px; border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .card-title {
      font-size: 15px; font-weight: 700; color: var(--text);
      margin-bottom: 18px; padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .card-title .icon { width: 20px; height: 20px; }
    .card-title .icon svg { width: 20px; height: 20px; }

    /* ══ Tables ══ */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    table th {
      background: var(--p-bg-l); padding: 10px 14px;
      text-align: left; font-weight: 600; color: var(--text-l);
      border-bottom: 2px solid var(--border);
      white-space: nowrap; font-size: 12px; letter-spacing: .5px;
    }
    table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    table tr:hover { background: var(--p-bg-l); }
    table .empty-row td { text-align: center; padding: 40px; color: var(--muted); }

    /* ══ Badges ══ */
    .badge-sm {
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 10px; white-space: nowrap;
    }
    .badge-active { background: var(--success-l); color: var(--success); }
    .badge-disabled { background: var(--danger-l); color: var(--danger); }
    .badge-pinned { background: var(--warn-l); color: var(--warn); }
    .badge-normal { background: var(--p-bg); color: var(--muted); }

    /* ══ Buttons ══ */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 18px; border-radius: 980px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: all .15s var(--transition-ease);
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--p-l); color: var(--p); }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-primary {
      background: var(--p); color: #fff; border-color: var(--p);
    }
    .btn-primary:hover { background: var(--p-d); border-color: var(--p-d); opacity: 1; }
    .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
    .btn-success:hover { opacity: .9; }
    .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-danger:hover { opacity: .9; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* ══ Forms ══ */
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 9px 12px; font-size: 14px; color: var(--text);
      outline: none; transition: border-color .2s; background: var(--surface);
      font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 120px; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--p-l); box-shadow: 0 0 0 3px rgba(156,107,60,.1); }
    .form-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .form-inline { display: flex; gap: 8px; align-items: end; }
    .form-inline .form-group { margin-bottom: 0; flex: 1; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

    /* ══ Inline edit ══ */
    .inline-edit { display: flex; align-items: center; gap: 6px; }
    .inline-edit input {
      width: 70px; padding: 4px 8px; border: 1.5px solid var(--border);
      border-radius: 6px; font-size: 13px; text-align: center;
      outline: none;
    }
    .inline-edit input:focus { border-color: var(--p-l); }

    /* ══ Tag input ══ */
    .tag-box {
      min-height: 40px; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 5px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      cursor: text; background: var(--surface); transition: border-color .2s;
    }
    .tag-box:focus-within { border-color: var(--p-l); }
    .tag-item {
      background: var(--p-bg); color: var(--p-d);
      border-radius: 6px; padding: 3px 10px;
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 4px;
    }
    .tag-item span { cursor: pointer; opacity: .6; font-size: 14px; line-height: 1; }
    .tag-item span:hover { opacity: 1; color: var(--danger); }
    .tag-input {
      border: none; outline: none; background: transparent;
      font-size: 14px; color: var(--text); min-width: 120px; flex: 1;
    }

    /* ══ Toggle ══ */
    .toggle-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .toggle-switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--border); border-radius: 24px;
      transition: background .2s; cursor: pointer;
    }
    .toggle-slider:before {
      content: ""; position: absolute;
      width: 18px; height: 18px; border-radius: 50%;
      background: #fff; top: 3px; left: 3px;
      transition: transform .2s; box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
    input:checked + .toggle-slider { background: var(--p); }
    input:checked + .toggle-slider:before { transform: translateX(20px); }
    .toggle-label { font-size: 14px; font-weight: 600; color: var(--text); }
    .toggle-hint { font-size: 12px; color: var(--muted); margin-left: 2px; }

    /* ══ Status panel ══ */
    .status-panel {
      background: var(--p-bg-l); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 18px; margin-top: 16px;
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px 20px;
    }
    .status-panel.running { border-color: #8DB878; background: var(--success-l); }
    .status-row { display: flex; gap: 6px; font-size: 13px; }
    .status-row .k { color: var(--muted); white-space: nowrap; }
    .status-row .v { font-weight: 600; color: var(--text); }

    /* ══ Chart bars ══ */
    .bar-chart { display: flex; align-items: end; gap: 8px; height: 160px; padding: 8px 0; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bar-fill {
      width: 100%; background: var(--p-l); border-radius: 6px 6px 0 0;
      min-height: 4px; transition: height .4s ease;
    }
    .bar-label { font-size: 10px; color: var(--muted); transform: rotate(-45deg); white-space: nowrap; margin-top: 4px; }
    .bar-val { font-size: 10px; color: var(--muted); font-weight: 600; }

    /* ══ Pagination ══ */
    .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; }
    .pagination button {
      background: var(--surface); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 6px; font-size: 13px;
      cursor: pointer; color: var(--text); transition: all .15s;
    }
    .pagination button:hover:not(:disabled) { border-color: var(--p); color: var(--p); }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }
    .pagination button.active { background: var(--p); color: #fff; border-color: var(--p); }
    .pagination .page-info { font-size: 13px; color: var(--muted); padding: 0 8px; }

    /* ══ Toast ══ */
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(156,107,60,.92);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 11px 24px; border-radius: 10px;
      font-size: 14px; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity .3s, transform .3s;
      z-index: 9999; max-width: 420px; text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(4px); }
    .toast.success { background: rgba(107,142,78,.92); }
    .toast.error { background: rgba(196,102,74,.92); }

    /* ══ Search bar ══ */
    .search-bar { display: flex; gap: 10px; margin-bottom: 16px; align-items: center; }
    .search-bar input {
      flex: 1; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 9px 14px; font-size: 14px; outline: none; transition: border-color .2s;
      background: var(--surface);
    }
    .search-bar input:focus { border-color: var(--p-l); }

    /* ══ Date range ══ */
    .date-range { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
    .date-range input[type="date"] {
      border: 1.5px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 13px; outline: none;
      color: var(--text); background: var(--surface);
    }
    .date-range input[type="date"]:focus { border-color: var(--p-l); }
    .date-range .sep { color: var(--muted); font-size: 13px; }

    /* ══ SQL results ══ */
    .sql-results { margin-top: 16px; }
    .sql-results .info { font-size: 13px; color: var(--muted); margin-bottom: 8px; }

    /* ══ CDK list ══ */
    .cdk-codes {
      background: var(--p-bg-l); border: 1px solid var(--border); border-radius: 8px;
      padding: 14px; max-height: 300px; overflow-y: auto; margin-top: 16px;
    }
    .cdk-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-radius: 6px; font-size: 13px;
      font-family: 'Consolas', 'Courier New', monospace;
      margin-bottom: 4px; background: var(--surface); border: 1px solid var(--border);
    }
    .cdk-row:hover { background: var(--p-bg-l); }
    .cdk-row .copy-btn {
      background: none; border: 1px solid var(--border);
      padding: 3px 10px; border-radius: 5px; font-size: 11px;
      cursor: pointer; color: var(--muted); transition: all .15s;
    }
    .cdk-row .copy-btn:hover { border-color: var(--p); color: var(--p); }

    /* ══ Loading ══ */
    .spinner {
      display: flex; align-items: center; justify-content: center; padding: 40px;
      color: var(--muted); font-size: 14px; gap: 8px;
    }
    .spinner::before {
      content: ""; width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--p);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .text-center { text-align: center; }
    .text-muted { color: var(--muted); }
    .mt-16 { margin-top: 16px; }
    .mb-16 { margin-bottom: 16px; }
    .gap-8 { gap: 8px; }

    /* ══ Overlay for mobile ══ */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.4); z-index: 199;
    }
    .sidebar-overlay.show { display: block; }

    /* ══ Responsive ══ */
    @media (max-width: 768px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; }
      .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); }
      .hamburger { display: block; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .form-grid, .form-grid-3 { grid-template-columns: 1fr; }
      .status-panel { grid-template-columns: 1fr 1fr; }
      .lock-box { width: 90%; padding: 36px 24px; }
      .content { padding: 16px; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .status-panel { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- ══ Lock Screen ══ -->
<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-icon"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/><circle cx="12" cy="16" r="1"/></svg></div>
    <div class="lock-title">管理员后台</div>

        <a href="index.html" style="font-size:12px;color:var(--muted);text-decoration:none">← 返回看板</a>
        <button class="btn-logout" @click="doLogout"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:2px"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出</button>

      <!-- ══ 热力图管理 ══ -->

        <div class="card">
          <div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.07-2.14-.23-4.05 0-6 .19-1.54.52-2.24 1-3 1.82 2.72 1.76 4.72 2 7 .19 1.82.38 3.55 0 5.5-.34 1.73-1.25 3.18-3 3.5-2.33.42-4.09-1.37-4.09-3.5 0-2.12 1.1-3.91 0-5.5"/></svg> 热力图管理</div>

      <!-- ══ 用户管理 ══ -->

          <div class="search-bar">

          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>用户名</th>
                  <th>角色</th>
                  <th>状态</th>
                  <th>注册时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody>
                <tr v-if="users.loading"><td colspan="5" class="empty-row"><span class="spinner"></span></td></tr>
                <tr v-else-if="users.list.length === 0"><td colspan="5" class="empty-row">暂无用户数据</td></tr>

      <!-- ══ 社招爬虫 ══ -->
      <template v-if="activeMenu === 'crawl'">
        <div class="card">
          <div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg> 社招爬虫配置 <span class="badge-sm" style="background:var(--primary-ll);color:var(--primary)">招聘信息</span></div>
          <div class="toggle-row">
            <label class="toggle-switch">
              <input type="checkbox" v-model="crawl.enabled">
              <span class="toggle-slider"></span>
            </label>
            <div>
              <div class="toggle-label">定时自动采集</div>
              <div class="toggle-hint" v-html="crawlToggleText()"></div>
            </div>
          </div>
          <div class="form-grid">
            <div class="form-group" style="grid-column:1/-1">
              <label>搜索关键词</label>
              <div class="tag-box" @click="$refs.crawlTagInput?.focus()">

                </span>

                  @keydown="onTagKeydown($event, crawl.keywords)"
                  @keyup="onTagKeyup($event, crawl.keywords)" />
              </div>
              <div class="form-hint">支持多个关键词，如：软件工程师、数据分析、产品经理</div>
            </div>
            <div class="form-group">
              <label>采集周期</label>
              <select v-model.number="crawl.interval_hours">

                <option :value="6">每 6 小时</option>
                <option :value="12">每 12 小时</option>
                <option :value="24">每天</option>
                <option :value="48">每 2 天</option>
                <option :value="168">每周</option>
              </select>
              <div class="form-hint">定时任务需保持服务运行</div>
            </div>
          </div>
          <div style="display:flex;gap:10px;margin-top:16px">
            <button class="btn btn-primary" @click="saveCrawlSchedule"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg> 保存配置</button>
            <button class="btn btn-success" :disabled="crawl.saving" @click="triggerCrawl">
              <span v-html="crawlBtnText()"></span>
            </button>
          </div>
          <div class="status-panel" :class="{ running: crawl.is_running }">
            <div class="status-row"><span class="k">服务状态：</span><span class="v" v-html="crawlStatusText()"></span></div>
            <div class="status-row"><span class="k">定时任务：</span><span class="v">{{ crawl.enabled ? '每 ' + crawl.interval_hours + ' 小时' : '已关闭' }}</span></div>
            <div class="status-row"><span class="k">上次采集：</span><span class="v">{{ crawl.last_run || '从未' }}</span></div>
            <div class="status-row"><span class="k">上次结果：</span><span class="v">{{ crawl.last_count != null ? crawl.last_count + ' 条' : '—' }}</span></div>
          </div>
        </div>
      </template>

      <template v-if="activeMenu === 'gkcrawl'">

          <div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg> 公考爬虫配置 <span class="badge-sm" style="background:var(--warn-l);color:var(--warn)">考公考编</span></div>

              <label>搜索关键词</label>

              <label>采集周期</label>
              <select v-model.number="gkcrawl.interval_hours">

                <option :value="12">每 12 小时</option>

          </div>

      <!-- ══ 数据浏览 ══ -->
      <template v-if="activeMenu === 'dbbrowse'">
        <div class="card">
          <div class="card-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg> 数据浏览</div>

            <label>选择数据表</label>
            <select v-model="dbbrowse.selectedTable" @change="loadTableData">
              <option value="">-- 请选择 --</option>
              <option v-for="t in dbbrowse.tables" :key="t.name" :value="t.name">

              </option>
            </select>
          </div>
          <div v-if="dbbrowse.selectedTable">
            <div class="table-wrap" style="max-height:500px;overflow-y:auto">
              <table>
                <thead>
                  <tr>
                    <th v-for="col in dbbrowse.columns" :key="col">{{ col }}</th>
                  </tr>
                </thead>
                <tbody>
                  <tr v-if="dbbrowse.loading"><td :colspan="dbbrowse.columns.length || 1" class="empty-row"><span class="spinner"></span></td></tr>
                  <tr v-else-if="dbbrowse.rows.length === 0"><td :colspan="dbbrowse.columns.length || 1" class="empty-row">暂无数据</td></tr>
                  <tr v-for="(row, ri) in dbbrowse.rows" :key="ri">

            </div>
          </div>
        </div>

<script>
// ══════════════════════════════════════════════════════════
// API Base URL
// ══════════════════════════════════════════════════════════
// 校园版单端口部署：前端与 API 同源，默认留空走相对路径
window.__API_BASE__ = '';
const API = window.__API_BASE__ || '';

// ══════════════════════════════════════════════════════════
// Token management
// ══════════════════════════════════════════════════════════
function getToken() { return localStorage.getItem('job_board_token') || ''; }
function setToken(t) { localStorage.setItem('job_board_token', t); }
function clearToken() { localStorage.removeItem('job_board_token'); }

function authHeaders() {
  return {
    'Content-Type': 'application/json',
    'Authorization': 'Bearer ' + getToken()
  };
}

// ══════════════════════════════════════════════════════════
// Toast
// ══════════════════════════════════════════════════════════
let _toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.innerHTML = msg;
  el.className = 'toast ' + type + ' show';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = 'toast'; }, 3000);
}

// ══════════════════════════════════════════════════════════
// Login
// ══════════════════════════════════════════════════════════
async function doLogin() {
  const username = document.getElementById('lockUser').value.trim();
  const password = document.getElementById('lockPass').value.trim();
  if (!username || !password) return;

  const btn = document.getElementById('lockBtn');
  const errEl = document.getElementById('lockErr');
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg> 登录中…';

  try {
    const resp = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (resp.ok && (data.token || data.access_token) && data.role === 'admin') {
      const token = data.token || data.access_token;
      setToken(token);
      unlockApp();
    } else if (resp.ok && data.role !== 'admin') {
      errEl.textContent = '该账号不是管理员，无法进入后台';
    } else {
      const inp = document.getElementById('lockPass');
      inp.classList.add('err');
      setTimeout(() => inp.classList.remove('err'), 400);
      errEl.textContent = data.message || data.msg || '登录失败';
      document.getElementById('lockPass').value = '';
    }
  } catch (e) {
    errEl.textContent = '无法连接后端服务';
  } finally {
    btn.disabled = false;
    btn.textContent = '进入后台';
  }
}

function unlockApp() {
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  initVueApp();
}

function doLogout() {
  clearToken();
  location.reload();
}

// ══════════════════════════════════════════════════════════
// API helper with auto-401 handling
// ══════════════════════════════════════════════════════════
async function apiFetch(url, options = {}) {
  const resp = await fetch(url, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
  if (resp.status === 401) {
    clearToken();
    showToast('登录已过期，请重新登录', 'error');
    setTimeout(() => location.reload(), 1500);
    throw new Error('Unauthorized');
  }
  return resp;
}

          case 'subscription': await this.loadSubscription(); break;

      // Safe province label (never throws during render)
      safeProvLabel(code) {
        try {
          if (!code && code !== 0) return '';
          return (typeof provLabel === 'function') ? provLabel(code) : String(code);
        } catch(e) { return String(code); }
      },

      // Tag input
      onTagKeydown(e, arr, lowercase) {
        // IME 输入法正在组合时，跳过（防止中文输入法回车确认被误处理）
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const v = (lowercase ? e.target.value.trim().toLowerCase() : e.target.value.trim());
          if (v && !arr.includes(v)) { arr.push(v); }
          e.target.value = '';
        } else if (e.key === 'Backspace' && !e.target.value && arr.length) {
          arr.pop();
        }
      },
      // keyup fallback for IME: when Chinese IME eats the Enter keydown,
      // keyup still fires with e.key === 'Enter' after composition ends
      onTagKeyup(e, arr, lowercase) {
        if (e.isComposing || e.keyCode === 229) return;
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const v = (lowercase ? e.target.value.trim().toLowerCase() : e.target.value.trim());
          if (v && !arr.includes(v)) { arr.push(v); }
          e.target.value = '';
        }
      },

        ALL_23_PROVINCES.forEach(p => { if (!arr.includes(p)) arr.push(p); });

      // ══ Hot ══
      async loadHot() {
        this.hot.loading = true;
        try {
          const resp = await apiFetch(`${API}/api/admin/hot/config`);
          const data = await resp.json();
          // API 返回 {social: [...], gk: [...]}，合并为统一列表
          let list = [];
          if (data.social) list = list.concat(data.social.map(item => ({ ...item, _job_type: '社招' })));
          if (data.gk) list = list.concat(data.gk.map(item => ({ ...item, _job_type: '公考' })));
          if (list.length === 0) list = Array.isArray(data) ? data : (data.list || data.data || []);
          list.forEach(item => { item._weight = item.weight; });
          this.hot.list = list;
        } catch (e) { if (e.message !== 'Unauthorized') showToast('加载热力图失败', 'error'); }
        finally { this.hot.loading = false; }
      },
      async saveHotWeight(item) {
        try {
          await apiFetch(`${API}/api/admin/hot/${item.id || item.hot_id}`, {
            method: 'PUT',
            body: JSON.stringify({ weight: item._weight, is_pinned: item.is_pinned })
          });
          item.weight = item._weight;
          showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="20 6 9 17 4 12"/></svg> 权重已更新', 'success');
        } catch (e) { if (e.message !== 'Unauthorized') showToast('更新失败', 'error'); }

            method: 'PUT',
            body: JSON.stringify({ weight: item.weight, is_pinned: pinned })
          });

          showToast(pinned ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="20 6 9 17 4 12"/></svg> 已置顶' : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="20 6 9 17 4 12"/></svg> 已取消置顶', 'success');

          const data = await resp.json();
          if (data.success || data.ok) {
            showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 00-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 012-3.95A12.88 12.88 0 0122 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 01-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg> 社招采集已启动', 'success');
            this.pollCrawlStatus();
          } else {
            showToast(data.message || data.detail || '启动失败', 'error');
            this.crawl.saving = false;
          }
        } catch (e) {
          if (e.message !== 'Unauthorized') showToast('请求失败', 'error');
          this.crawl.saving = false;
        }
      },
      pollCrawlStatus() {
        const timer = setInterval(async () => {
          try {
            const resp = await apiFetch(`${API}/api/admin/crawl/schedule`);
            const data = await resp.json();
            this.crawl.is_running = data.is_running;
            if (!data.is_running) {
              clearInterval(timer);
              this.crawl.saving = false;
              this.crawl.last_run = data.last_run;
              this.crawl.last_count = data.last_count;
              showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="20 6 9 17 4 12"/></svg> 采集完成！共 ' + (data.last_count || 0) + ' 条', 'success');
            }
          } catch { clearInterval(timer); this.crawl.saving = false; }
        }, 3000);
      },

      // ══ GkCrawl ══
      async loadGkCrawlSchedule() {
        try {
          const resp = await apiFetch(`${API}/api/admin/crawl/gk/schedule`);
          const data = await resp.json();
          if (!data || typeof data !== 'object') { showToast('配置数据异常', 'error'); return; }
          this.gkcrawl.keyword = data.keyword || '公务员';
          this.gkcrawl.year = String(data.year || '2026');
          this.gkcrawl.interval_hours = Number(data.interval_hours) || 24;
          this.gkcrawl.provinces = Array.isArray(data.provinces) ? data.provinces : [];
          this.gkcrawl.is_running = !!data.is_running;
          this.gkcrawl.last_run = data.last_run || '';
          this.gkcrawl.last_count = data.last_count != null ? data.last_count : null;
        } catch (e) {
          if (e.message !== 'Unauthorized') showToast('加载配置失败', 'error');
        }
      },
      async saveGkCrawlSchedule() {
        try {
          await apiFetch(`${API}/api/admin/crawl/gk/schedule`, {
            method: 'POST',
            body: JSON.stringify({
              enabled: true,
              interval_hours: this.gkcrawl.interval_hours,
              keyword: this.gkcrawl.keyword,
              year: this.gkcrawl.year,
              provinces: this.gkcrawl.provinces
            })
          });
          showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="20 6 9 17 4 12"/></svg> 配置已保存', 'success');
          this.loadGkCrawlSchedule();
        } catch (e) { if (e.message !== 'Unauthorized') showToast('保存失败', 'error'); }
      },
      async triggerGkCrawl() {
        this.gkcrawl.saving = true;
        try {
          const resp = await apiFetch(`${API}/api/admin/crawl/gk/now`, { method: 'POST' });
          const data = await resp.json();
          if (data.success || data.ok) {
            showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 00-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 012-3.95A12.88 12.88 0 0122 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 01-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg> 公考采集已启动', 'success');
            this.pollGkStatus();
          } else {
            showToast(data.message || data.detail || '启动失败', 'error');
            this.gkcrawl.saving = false;
          }
        } catch (e) {
          if (e.message !== 'Unauthorized') showToast('请求失败', 'error');
          this.gkcrawl.saving = false;
        }
      },
      pollGkStatus() {
        const timer = setInterval(async () => {
          try {
            const resp = await apiFetch(`${API}/api/admin/crawl/gk/schedule`);
            const data = await resp.json();
            this.gkcrawl.is_running = data.is_running;
            if (!data.is_running) {
              clearInterval(timer);
              this.gkcrawl.saving = false;
              this.gkcrawl.last_run = data.last_run;
              this.gkcrawl.last_count = data.last_count;
              showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="20 6 9 17 4 12"/></svg> 公考采集完成！共 ' + (data.last_count || 0) + ' 条', 'success');
            }
          } catch { clearInterval(timer); this.gkcrawl.saving = false; }
        }, 3000);
      },

      // ══ DB Browse ══
      async loadDbTables() {
        try {
          const resp = await apiFetch(`${API}/api/admin/db/tables`);
          const data = await resp.json();
          this.dbbrowse.tables = Array.isArray(data) ? data : (data.tables || []);
        } catch (e) { if (e.message !== 'Unauthorized') showToast('加载表列表失败', 'error'); }
      },
      async loadTableData() {
        if (!this.dbbrowse.selectedTable) return;
        this.dbbrowse.loading = true;
        try {
          const resp = await apiFetch(`${API}/api/admin/db/table/${this.dbbrowse.selectedTable}?page=${this.dbbrowse.page}&page_size=${this.dbbrowse.pageSize}`);
          const data = await resp.json();
          const rows = data.rows || data.data || [];
          this.dbbrowse.rows = rows;
          this.dbbrowse.columns = rows.length > 0 ? Object.keys(rows[0]) : (data.columns || []);
          this.dbbrowse.total = data.total || rows.length;
        } catch (e) { if (e.message !== 'Unauthorized') showToast('加载数据失败', 'error'); }
        finally { this.dbbrowse.loading = false; }
      },

      // ══ SQL Query ══
      async execSql() {
        const sql = this.sqlquery.sql.trim();
        if (!sql) return showToast('请输入 SQL 语句', 'error');
        if (!sql.toLowerCase().startsWith('select')) return showToast('仅允许 SELECT 查询', 'error');

        this.sqlquery.loading = true;
        this.sqlquery.result = false;
        this.sqlquery.columns = null;
        this.sqlquery.rows = [];
        this.sqlquery.error = '';

        try {
          const resp = await apiFetch(`${API}/api/admin/db/query`, {
            method: 'POST',
            body: JSON.stringify({ sql })
          });
          const data = await resp.json();
          this.sqlquery.result = true;
          if (data.error) {
            this.sqlquery.error = data.error;
          } else {
            const rows = data.rows || data.data || [];
            this.sqlquery.rows = rows;
            this.sqlquery.columns = rows.length > 0 ? Object.keys(rows[0]) : (data.columns || []);
          }
        } catch (e) { if (e.message !== 'Unauthorized') showToast('查询失败', 'error'); }
        finally { this.sqlquery.loading = false; }
      },

      // ══ 数据源健康 / Cookie / 订阅推送 ══
      async loadHealth() {
        this.health.loading = true;
        try {
          const resp = await apiFetch(`${API}/api/admin/health`);
          const data = await resp.json();
          this.health.data = data;
          this.cookies.list = data.cookies || [];
        } catch (e) { if (e.message !== 'Unauthorized') showToast('加载健康状态失败', 'error'); }
        finally { this.health.loading = false; }
      },
      async uploadCookie(ck, event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        this.cookies.uploading = ck.key;
        try {
          const form = new FormData();
          form.append('file', file);
          const resp = await fetch(`${API}/api/admin/cookies/upload?platform=${encodeURIComponent(ck.key)}`, {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + getToken() },
            body: form
          });
          const data = await resp.json();
          if (resp.ok && data.ok) {
            showToast(data.message || '上传成功', 'success');
            this.loadHealth();
          } else {
            showToast(data.detail || data.message || '上传失败', 'error');
          }
        } catch (e) { showToast('上传失败: ' + e.message, 'error'); }
        finally { this.cookies.uploading = ''; event.target.value = ''; }
      },
      async loadSubscription() {
        try {
          const resp = await apiFetch(`${API}/api/admin/subscription/schedule`);
          const data = await resp.json();
          this.subscription.enabled = data.enabled;
          this.subscription.interval_hours = data.interval_hours || 48;
          this.subscription.last_run = data.last_run || '';
          this.subscription.last_scan_count = data.last_scan_count || 0;
          this.subscription.last_notify_count = data.last_notify_count || 0;
          this.subscription.is_running = !!data.is_running;
        } catch (e) { if (e.message !== 'Unauthorized') showToast('加载订阅配置失败', 'error'); }
      },
      async saveSubscription() {
        this.subscription.saving = true;
        try {
          await apiFetch(`${API}/api/admin/subscription/schedule`, {
            method: 'POST',
            body: JSON.stringify({
              enabled: this.subscription.enabled,
              interval_hours: this.subscription.interval_hours
            })
          });
          showToast('订阅推送配置已保存', 'success');
          this.loadSubscription();
        } catch (e) { if (e.message !== 'Unauthorized') showToast('保存失败', 'error'); }
        finally { this.subscription.saving = false; }
      },
      async scanSubNow() {
        this.subscription.is_running = true;
        try {
          const resp = await apiFetch(`${API}/api/admin/subscription/scan-now`, { method: 'POST' });
          const data = await resp.json();
          showToast(data.message || '扫描已启动', 'success');
          setTimeout(() => this.loadSubscription(), 3000);
        } catch (e) { if (e.message !== 'Unauthorized') showToast('启动失败', 'error'); this.loadSubscription(); }
      },
      async changePassword() {
        if (!this.settings.oldPwd || !this.settings.newPwd) return showToast('请填写完整信息', 'error');
        if (this.settings.newPwd.length < 6) return showToast('新密码至少6位', 'error');
        this.settings.changingPwd = true;
        try {
          const resp = await apiFetch(`${API}/api/auth/change-password`, {
            method: 'POST',
            body: JSON.stringify({
              old_password: this.settings.oldPwd,
              new_password: this.settings.newPwd
            })
          });
          const data = await resp.json();
          if (resp.ok) {
            showToast('<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="20 6 9 17 4 12"/></svg> 密码已修改', 'success');
            this.settings.oldPwd = '';
            this.settings.newPwd = '';
          } else {
            showToast(data.message || '修改失败', 'error');
          }
        } catch (e) { if (e.message !== 'Unauthorized') showToast('修改失败', 'error'); }
        finally { this.settings.changingPwd = false; }
      }
    },

    mounted() {
      window.addEventListener('resize', () => {
        this.isMobile = window.innerWidth <= 768;
        if (!this.isMobile) this.sidebarCollapsed = false;
      });
      this.loadDashboard();
    }
  });

  app.config.errorHandler = function(err, vm, info) {
    const errMsg = err ? (err.message || String(err)) : '未知错误';
    console.error('[Vue Error]', errMsg, info, err && err.stack);
    // 显示具体错误信息便于诊断，但不再自动跳转（避免误切页面）
    if (vm) {
      showToast('[' + (info || 'render') + '] ' + errMsg, 'error');
    }
  };

  app.mount('#app');
}

// ══════════════════════════════════════════════════════════
// Auto-auth on page load
// ══════════════════════════════════════════════════════════
(async function autoAuth() {
  const token = getToken();
  if (!token) return;
  try {
    const resp = await fetch(`${API}/api/auth/verify`, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (resp.ok) {
      unlockApp();
    } else {
      clearToken();
    }
  } catch (e) {
    // Backend not running, don't auto-unlock
  }
})();
</script>
</body>
</html>
