<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#9C6B3C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="商贸就业" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <title>西南大学商贸学院 · 就业服务平台</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B8845A' stroke-width='1.6'><rect x='2' y='3' width='8' height='8' rx='1.5'/><rect x='14' y='3' width='8' height='8' rx='1.5'/><rect x='2' y='13' width='8' height='8' rx='1.5'/><rect x='14' y='13' width='8' height='8' rx='1.5'/></svg>">
  <style>
    :root {
      --p: #9C6B3C;
      --p-l: #B8845A;
      --p-d: #7A5230;
      --p-bg: #F2EAE0;
      --bg: #FBF8F3;
      --surface: #FFFFFF;
      --border: #E8DDD0;
      --text: #1C1814;
      --sub: #6B5A4A;
      --subl: #A08060;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #FBF8F3 0%, #F5F0E8 35%, #F2EDE4 60%, #F8F4EE 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 800px 600px at 85% 5%, rgba(220,195,170,.35) 0%, transparent 55%),
                  radial-gradient(ellipse 700px 500px at 10% 90%, rgba(210,180,150,.28) 0%, transparent 55%),
                  radial-gradient(ellipse 500px 400px at 55% 38%, rgba(235,210,180,.20) 0%, transparent 50%),
                  radial-gradient(ellipse 450px 350px at 72% 82%, rgba(200,165,140,.15) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 800px 600px at 85% 5%, rgba(220,195,170,.38) 0%, transparent 70%),
                  radial-gradient(ellipse 700px 500px at 10% 90%, rgba(210,180,150,.32) 0%, transparent 65%),
                  radial-gradient(ellipse 600px 450px at 55% 38%, rgba(235,200,160,.28) 0%, transparent 60%),
                  radial-gradient(ellipse 500px 400px at 72% 82%, rgba(200,165,140,.24) 0%, transparent 55%),
                  radial-gradient(ellipse 550px 380px at 25% 15%, rgba(215,185,155,.22) 0%, transparent 58%);
      pointer-events: none;
      z-index: 0;
    }
    .card {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 48px 56px;
      border: 1px solid var(--border);
      text-align: center;
      max-width: 520px;
      width: 90%;
      position: relative;
      z-index: 1;
      animation: fadeUp .5s cubic-bezier(.4,0,.2,1);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-icon { margin-bottom: 16px; }
    .card-icon svg { width: 56px; height: 56px; color: var(--p); }
    .card-title { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 8px; letter-spacing: -.02em; }
    .card-sub { font-size: 14px; color: var(--sub); margin-bottom: 32px; line-height: 1.6; }
    .card-links { display: flex; flex-direction: column; gap: 14px; }
    .card-link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      transition: all .2s cubic-bezier(.4,0,.2,1);
    }
    .card-link:hover {
      border-color: var(--p-l);
      background: #fff;
    }
    .card-link .icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--p-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--p);
    }
    .card-link .icon svg { width: 22px; height: 22px; }
    .card-link .info { flex: 1; text-align: left; min-width: 0; }
    .card-link .info .name { font-size: 15px; font-weight: 600; }
    .card-link .info .desc { font-size: 12px; color: var(--sub); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-link .arrow { color: var(--subl); flex-shrink: 0; transition: all .2s; }
    .card-link .arrow svg { width: 18px; height: 18px; }
    .card-link:hover .arrow { color: var(--p); transform: translateX(4px); }
    .card-link.admin-link { border-color: #F0E0D8; background: #FDF7F5; }
    .card-link.admin-link:hover { border-color: var(--p); }
    .card-link.admin-link .icon { background: #F5E8E4; color: #8C4A3C; }
  </style>
</head>
<body>

<div class="card">
  <div class="card-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="8" height="8" rx="1.5"/>
      <rect x="14" y="3" width="8" height="8" rx="1.5"/>
      <rect x="2" y="13" width="8" height="8" rx="1.5"/>
      <rect x="14" y="13" width="8" height="8" rx="1.5"/>
    </svg>
  </div>
  <div class="card-title">西南大学商贸学院 · 就业服务平台</div>
  <div class="card-sub">岗位浏览 · 智能匹配 · 简历分析 · 数据洞察</div>
  <div class="card-links">
    <a href="resume_match.html" class="card-link">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10" cy="10" r="7"/>
          <line x1="15" y1="15" x2="21" y2="21"/>
        </svg>
      </span>
      <span class="info">
        <span class="name">就业服务平台</span>
        <span class="desc">岗位浏览 / 智能匹配 / 简历分析 / 订阅推送</span>
      </span>
      <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
    </a>
    <a href="admin.html" class="card-link admin-link">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7 11V7a5 5 0 0110 0v4"/>
        </svg>
      </span>
      <span class="info">
        <span class="name">管理后台</span>
        <span class="desc">爬虫管理 / 用户管理 / 财务统计 / 系统设置</span>
      </span>
      <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
    </a>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(function(reg) {
    console.log('[PWA] Service Worker registered:', reg.scope);
  }).catch(function(err) {
    console.warn('[PWA] SW registration failed:', err);
  });
}
</script>
</body>
</html>
